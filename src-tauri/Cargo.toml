[package]
name = "character-triptych-prompt"
version = "0.1.0"
description = "A focused Soul 2.0 character triptych prompt optimizer"
authors = ["Character Triptych"]
license = ""
repository = "https://github.com/xgq947-ship-it/character-triptych-prompt"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "character_triptych_prompt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-store = "2"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
